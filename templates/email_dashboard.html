<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Validation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white text-center font-sans m-0 p-0 transition-colors duration-300">
  
  <!-- Header -->
<div class="w-full flex justify-between items-center px-[30px] py-[15px] absolute top-0 left-0">
    <div class="flex items-center gap-[20px] text-[14px]">
      <span class="font-bold text-[16px]">MailGuard®</span>
      <a href="{{ url_for('landing') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Home</a>
      <a href="{{ url_for('validations') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Email-Validation</a>

    </div>

    <!-- Theme change -->
    <button id="theme-toggle" class="px-5 py-3 rounded-full transition">
      <img id="theme-icon" src="{{ url_for('static', filename='images/night-mode.png') }}" alt="Toggle Theme" class="w-6 h-6">
    </button>
  </div>
  <br>

  <!-- Container -->
  <div class="p-6">
  <h1 class="text-3xl font-bold text-center my-8"> Spam Detection Dashboard</h1>
   

    <hr class="my-4 border-gray-300 dark:border-gray-700"/>

    <!-- Latest Email Validation -->
    <h2 class="text-xl font-semibold mt-6">Latest Email Validation</h2>
    <div class="flex justify-around mt-6">
      <div class="text-center">
        <h4 class="font-medium mb-2">Email</h4>
        <p id="email" class="text-lg font-bold">-</p>
      </div>
      <div class="text-center">
        <h4 class="font-medium mb-2">Validation Status</h4>
        <p id="status" class="text-lg font-bold">-</p>
      </div>
    </div>

    <!-- Pie Chart -->
    <h2 class="text-xl font-semibold mt-8">Detailed Validation Checks</h2>
    <div class="flex justify-center my-6">
      <canvas id="validationPieChart" width="400" height="300"></canvas>
    </div>

    <!-- Database Table -->
    <h2 class="text-xl font-semibold mt-8">Database Records</h2>
    <div class="overflow-x-auto mt-4">
      <table class="w-full border border-gray-300 dark:border-gray-600 text-left">
        <thead class="bg-gray-200 dark:bg-gray-800">
          <tr>
            <th class="p-3">Email</th>
            <th class="p-3">Status</th>
            <th class="p-3">Score</th>
            <th class="p-3">Syntax</th>
            <th class="p-3">Domain</th>
            <th class="p-3">MX</th>
            <th class="p-3">Mailbox</th>
            <th class="p-3">Disposable</th>
            <th class="p-3">Role-Based</th>
          </tr>
        </thead>
        <tbody id="validationTable" class="divide-y divide-gray-300 dark:divide-gray-600">
          <!-- Data dynamically injected here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Script -->
  <script>
    async function loadData() {
      try {
        const response = await fetch("http://127.0.0.1:5000/api/emails");
        const data = await response.json();

        if (!data || data.length === 0) {
          document.getElementById("email").innerText = "No records found";
          document.getElementById("status").innerText = "-";
          document.getElementById("status").style.color = "gray";
          return;
        }

        const latest = data[0];
        const latestStatus = latest.status ? latest.status.toLowerCase() : "";
        document.getElementById("email").innerText = latest.email;
        document.getElementById("status").innerText = latest.status;
        document.getElementById("status").style.color = latestStatus === "valid" ? "green" : "red";

        const tbody = document.querySelector("#validationTable");
        tbody.innerHTML = "";
        data.forEach(row => {
          const statusText = row.status ? row.status.toLowerCase() : "";
          const statusColor = statusText === "valid" ? "text-green-600 font-bold" : "text-red-600 font-bold";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="p-3">${row.email}</td>
            <td class="p-3 ${statusColor}">${row.status}</td>
            <td class="p-3">${row.score}</td>
            <td class="p-3">${row.syntax_check}</td>
            <td class="p-3">${row.domain_exists}</td>
            <td class="p-3">${row.mx_records}</td>
            <td class="p-3">${row.mailbox_exists}</td>
            <td class="p-3">${row.is_disposable}</td>
            <td class="p-3">${row.is_role_based}</td>
          `;
          tbody.appendChild(tr);
        });

        const validCount = data.filter(d => d.status && d.status.toLowerCase() === "valid").length;
        const invalidCount = data.length - validCount;

        new Chart(document.getElementById('validationPieChart'), {
          type: 'pie',
          data: {
            labels: ['Valid', 'Invalid'],
            datasets: [{
              data: [validCount, invalidCount],
              backgroundColor: ['green', 'red']
            }]
          },
          options: {
            responsive: false,
            plugins: {
              title: {
                display: true,
                text: 'Validation Status Distribution'
              }
            }
          }
        });

      } catch (err) {
        console.error("Error loading data:", err);
      }
    }
    loadData();
  </script>
   <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const root = document.documentElement;

    const moon = "{{ url_for('static', filename='images/night-mode.png') }}";
    const sun = "{{ url_for('static', filename='images/brightness-and-contrast.png') }}";

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      root.classList.add('dark');
      icon.src = sun;
    } else {
      root.classList.remove('dark');
      icon.src = moon;
    }

    toggle.addEventListener('click', () => {
      const isDark = root.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.src = isDark ? sun : moon;
    });
  </script>
</body>
</html>
