<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📊 Spam Detection Dashboard</title>
  
  <!-- Tailwind CSS -->
  <!-- <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script> -->

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #000000;
      --header-bg-light: #000000;
      --link-light: #ffffff;

      --bg-dark: #0E1117;
      --text-dark: #ffffff;
      --header-bg-dark: #000000;
      --link-dark: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--header-bg-light);
      color: var(--link-light);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: var(--link-light);
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      padding: 20px 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .prediction {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0;
      padding: 10px;
      background: #fff;
      border-radius: 6px;
      text-align: center;
    }

    .spam {
      color: red;
    }

    .ham {
      color: green;
    }

    img {
      margin-top: 20px;
      border-radius: 8px;
      width: 100%;
      max-width: 600px;
      border: 1px solid #ccc;
    }

    .dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .dark-mode header {
      background-color: var(--header-bg-dark);
      color: var(--link-dark);
    }

    .dark-mode nav a {
      color: var(--link-dark);
    }

    .toggle-button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: none;
      border-radius: 5px;
      cursor: pointer;
      color: inherit;
    }

    .matrix-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
    }

    .plot-box {
      background-color: white;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      max-width: 48%;
      flex: 1;
      text-align: center;
    }

    .dark-mode .plot-box {
      background-color: #1c1c1c;
      border: 1px solid #444;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>MailGuard®</strong></div> 
    <nav>
      <a href="{{ url_for('landing') }}">Home</a>
      <a href="{ url_for('spam') }">Spam Dectation</a>
      
    </nav> 
     <!-- <div class="w-full flex justify-between items-center px-[30px] py-[15px] absolute top-0 left-0">
    <div class="flex items-center gap-[20px] text-[14px]">
      <span class="font-bold text-[16px]">MailGuard®</span>
      <a href="{{ url_for('landing') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Home</a>
      <a href="{{ url_for('validations') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Email-Validation</a> -->


  </header>

  <div class="container">
    <div class="top-bar">
      <h1>📧 Spam Detection Dashboard</h1>
      <button class="toggle-button" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <hr />

    <!-- Latest Prediction -->
    <h2>🧠 Latest XGBoost Prediction</h2>
    <div id="latestPrediction" class="prediction">Loading...</div>

    <!-- Confusion Matrix + Spam Count Side-by-Side -->
    <h2>📈 Email Classification Overview</h2>
    <div class="matrix-container">
      <div class="plot-box">
        <h3>🔍 Confusion Matrix</h3>
        <img src="{{ url_for('confusion_matrix_plot') }}" alt="Confusion Matrix" />
      </div>
      <div class="plot-box">
        <h3>📊 Spam vs Ham Count</h3>
        {% if spam_plot %}
          <img src="{{ spam_plot }}" alt="Spam vs Ham Count" />
        {% else %}
          <p style="color: red;">⚠️ Could not generate plot.</p>
        {% endif %}
      </div>
    </div>
  </div>

  <script>
    async function loadLatestPrediction() {
      const response = await fetch("/api/spam/results");
      const results = await response.json();

      const latest = results?.[0];
      const predDiv = document.getElementById("latestPrediction");

      if (latest && "xgboost_pred" in latest) {
        const label = latest.xgboost_pred === 1 ? "Spam" : "Ham";
        const className = latest.xgboost_pred === 1 ? "spam" : "ham";
        predDiv.innerHTML = `<span class="${className}">${label}</span>`;
      } else {
        predDiv.textContent = "No data available.";
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const btn = document.querySelector(".toggle-button");
      const isDark = document.body.classList.contains("dark-mode");
      btn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
    }

    loadLatestPrediction();
  </script>
</body>
</html>
