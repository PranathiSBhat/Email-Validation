<!-- templates/spam_dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📊 Spam Detection Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
</head>
<body class="bg-white text-black dark:bg-black dark:text-white text-center font-sans m-0 p-0 transition-colors duration-300">

   <div class="w-full flex justify-between items-center px-[30px] py-[15px] absolute top-0 left-0">
    <div class="flex items-center gap-[20px] text-[14px]">
      <span class="font-bold text-[16px]">MailGuard®</span>
      <a href="{{ url_for('landing') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Home</a>
      <a href="{{ url_for('spam') }}" class="hover:text-green-500 dark:hover:text-[#00FF00] transition-colors duration-300">Spam-Check</a>

    </div>

    <!-- Theme change -->
    <button id="theme-toggle" class="px-5 py-3 rounded-full transition">
      <img id="theme-icon" src="{{ url_for('static', filename='images/night-mode.png') }}" alt="Toggle Theme" class="w-6 h-6">
    </button>
  </div>
<br><br>
  <h1 class="text-3xl font-bold text-center my-8"> Spam Detection Dashboard</h1>

  <div class="flex flex-wrap justify-center gap-6 px-4">
    
    <!-- Confusion Matrix -->
    <div class="w-full max-w-md bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md text-center">
      <h2 class="text-xl font-semibold mb-4"> Confusion Matrix</h2>
      {% if confusion_matrix_url %}
        <img src="{{ confusion_matrix_url }}" alt="Confusion Matrix" class="rounded-lg w-full h-auto">
      {% else %}
        <p class="text-sm text-gray-500 dark:text-gray-400">No data available for confusion matrix.</p>
      {% endif %}
    </div>

    <!-- Spam vs Ham Count -->
    <div class="w-full max-w-md bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md text-center">
      <h2 class="text-xl font-semibold mb-4"> Spam vs Ham Count</h2>
      {% if spam_count_url %}
        <img src="{{ spam_count_url }}" alt="Spam Count" class="rounded-lg w-full h-auto">
      {% else %}
        <p class="text-sm text-gray-500 dark:text-gray-400">No data available for spam count.</p>
      {% endif %}
    </div>

  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const root = document.documentElement;

    const moon = "{{ url_for('static', filename='images/night-mode.png') }}";
    const sun = "{{ url_for('static', filename='images/brightness-and-contrast.png') }}";

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      root.classList.add('dark');
      icon.src = sun;
    } else {
      root.classList.remove('dark');
      icon.src = moon;
    }

    toggle.addEventListener('click', () => {
      const isDark = root.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      icon.src = isDark ? sun : moon;
    });
  </script>

</body>
</html>
