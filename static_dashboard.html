<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Validation Dashboard</title>
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #000000;
      --header-bg-light: #000000;
      --link-light: #ffffff;

      --bg-dark: #0E1117;
      --text-dark: #ffffff;
      --header-bg-dark: #000000;
      --link-dark: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--header-bg-light);
      color: var(--link-light);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: var(--link-light);
      margin-left: 20px;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      padding: 20px 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .email-status {
      display: flex;
      justify-content: space-around;
      margin: 30px 0;
    }

    .email-status h4 {
      margin-bottom: 10px;
    }

    .dark-mode {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .dark-mode header {
      background-color: var(--header-bg-dark);
      color: var(--link-dark);
    }

    .dark-mode nav a {
      color: var(--link-dark);
    }

    .toggle-button {
      padding: 8px 14px;
      border: 1px solid #ccc;
      background: none;
      border-radius: 5px;
      cursor: pointer;
      color: inherit;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    table th,
    table td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    table th {
      background-color: #f4f4f4;
    }

    /* Image chart styling */
    #validationPieChartImg {
      display: block;
      margin: 0 auto;
      max-width: 400px;
      max-height: 300px;
    }
  </style>
</head>

<body>
  <header>
    <div><strong>MailGuard®</strong></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Email Validation</a>
      <a href="#">Help</a>
    </nav>
  </header>

  <div class="container">
    <div class="top-bar">
      <h1>Email Validation Dashboard</h1>
      <button class="toggle-button" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <hr />

    <div class="email-status">
      <div>
        <h4>Email</h4>
        <p id="email" style="font-size: 18px; font-weight: bold;">eac@gmail.com</p>
      </div>
      <div>
        <h4>Validation Status</h4>
        <p id="status" style="font-size: 18px; font-weight: bold; color: red;">INVALID</p>
      </div>
    </div>

    <h2>Detailed Validation Checks</h2>
    
    <div style="text-align: center; margin: 10px 0;">
      <button onclick="refreshPieChart()" style="padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
        🔄 Refresh Chart
      </button>
    </div>

    <!-- Pie chart image -->
    <div id="pieChartContainer">
      <img id="validationPieChartImg" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==" alt="Validation Pie Chart"
        style="max-width:400px; max-height:300px; display: block; margin: 0 auto;" />
    </div>

    <table id="validationTable">
      <thead>
        <tr>
          <th>Check</th>
          <th>Result</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Syntax Check</td>
          <td>❌ Failed</td>
        </tr>
        <tr>
          <td>Domain Exists</td>
          <td>✅ Passed</td>
        </tr>
        <tr>
          <td>MX Records</td>
          <td>✅ Passed</td>
        </tr>
        <tr>
          <td>Mailbox Exists</td>
          <td>✅ Passed</td>
        </tr>
        <tr>
          <td>Disposable</td>
          <td>✅ Passed</td>
        </tr>
        <tr>
          <td>Role-based</td>
          <td>✅ Passed</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // Theme toggle logic
    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const btn = document.querySelector(".toggle-button");
      const isDark = document.body.classList.contains("dark-mode");
      btn.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";
    }

    // Refresh pie chart function
    function refreshPieChart() {
      const pieChartContainer = document.getElementById('pieChartContainer');
      if (pieChartContainer) {
        pieChartContainer.innerHTML = `<img id="validationPieChartImg" src="/api/pie-chart-image?ts=${new Date().getTime()}" alt="Validation Pie Chart" style="max-width:400px; max-height:300px; display: block; margin: 0 auto;" />`;
      }
    }

    // Load data function
    async function loadData() {
      try {
        const response = await fetch("http://127.0.0.1:5000/api/emails");
        const data = await response.json();

        if (!data || data.length === 0) {
          document.getElementById("email").innerText = "No records found";
          document.getElementById("status").innerText = "-";
          document.getElementById("status").style.color = "gray";
          return;
        }

        // Take the latest email record
        const latest = data[0];

        // Prepare validation object from DB fields
        const validationData = {
          email: latest.email,
          validations: {
            'Syntax Check': latest.syntax_check === 1,
            'Domain Exists': latest.domain_exists === 1,
            'MX Records': latest.mx_records === 1,
            'Mailbox Exists': latest.mailbox_exists === 1,
            'Disposable': latest.is_disposable === 1,
            'Role-based': latest.is_role_based === 1
          }
        };

        // Update email + status
        document.getElementById("email").innerText = validationData.email;
        const allPassed = Object.values(validationData.validations).every(Boolean);
        document.getElementById("status").innerText = allPassed ? "VALID" : "INVALID";
        document.getElementById("status").style.color = allPassed ? "green" : "red";

        // Update table
        const tbody = document.querySelector("#validationTable tbody");
        tbody.innerHTML = "";
        for (let [check, passed] of Object.entries(validationData.validations)) {
          const row = document.createElement("tr");
          row.innerHTML = `<td>${check}</td><td>${passed ? "✅ Passed" : "❌ Failed"}</td>`;
          tbody.appendChild(row);
        }

        // Update pie chart
        refreshPieChart();

      } catch (err) {
        console.error("Error fetching data:", err);
        console.log("Make sure the Flask app is running on http://127.0.0.1:5000");
      }
    }

    // Load data on page load
    loadData();
  </script>
</body>

</html>
